        const f = Math.max(laserLife[i] / laserMaxLife[i], 0);
        laserAlpha[i] = laserBright[i] * Math.pow(f, 1.3);
        laserSize[i] = laserSizeBase[i] * (0.5 + 0.5 * f);
      }
      laserGeo.attributes.position.needsUpdate = true;
      laserGeo.attributes.aAlpha.needsUpdate = true;
      laserGeo.attributes.aSize.needsUpdate = true;
      if (!any && !lineVisible) { laserAlive = 0; laserSparks.visible = false; }
    }


    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };
    let autoRotate = false;
    const friction = 0.94; // Inertia dampening

    // Mouse tilt effect when hovering (tactile physics)
    let hoverTiltX = 0;
    let hoverTiltY = 0;

    const rotationIndicator = document.getElementById('rotation-indicator');

    function onPointerDown(e) {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      previousPointerPosition = { x: clientX, y: clientY };
      rotationVelocity = { x: 0, y: 0 };
    }

    function onPointerMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // Update foil light coordinate
      const ndcX = clientX / window.innerWidth;
      const ndcY = 1.0 - (clientY / window.innerHeight);
      foilCustomShader.uniforms.uMouse.value.set(ndcX, ndcY);

      if (isDragging) {
        const deltaX = clientX - previousPointerPosition.x;
        const deltaY = clientY - previousPointerPosition.y;

        const rotSpeed = 0.0075;
        rotationVelocity.y = deltaX * rotSpeed;
        rotationVelocity.x = deltaY * rotSpeed;

        cardGroup.rotation.y += rotationVelocity.y;
        cardGroup.rotation.x += rotationVelocity.x;

        previousPointerPosition = { x: clientX, y: clientY };
      } else {
        // Tilt on hover: the side under the pointer dips away from the viewer,
        // which changes the foil angle (and therefore the rainbow colours)
        const normX = (clientX / window.innerWidth) * 2 - 1;
        const normY = -(clientY / window.innerHeight) * 2 + 1;
        hoverTiltX = -normY * 0.35;
        hoverTiltY = normX * 0.45;
      }
    }

    function onPointerUp() {
      isDragging = false;
    }

    container.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    container.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // Zooming with mouse wheel
    window.addEventListener('wheel', (e) => {
      // Scrolling inside a panel (e.g. the thumbnail list) shouldn't zoom the card
      if (e.target.closest && e.target.closest('.glass-panel')) return;
      camera.position.z += e.deltaY * 0.004;
      camera.position.z = Math.min(Math.max(camera.position.z, 3.8), 11.0);
    }, { passive: true });

    const btnFlip = document.getElementById('btn-flip');
    const btnAutoRotate = document.getElementById('btn-autorotate');
    const btnReset = document.getElementById('btn-reset');
    const autoRotateIcon = document.getElementById('autorotate-icon');
    const autoRotateLabel = document.getElementById('autorotate-label');

    // Smooth Flip 180°
    let isFlipping = false;
    let flipStartTime = 0;
    let flipStartAngle = 0;
    let flipTargetAngle = 0;

    btnFlip.addEventListener('click', () => {
      isFlipping = true;
      flipStartTime = performance.now();
      flipStartAngle = cardGroup.rotation.y;
      flipTargetAngle = cardGroup.rotation.y + Math.PI; // 180 degrees
      rotationVelocity = { x: 0, y: 0 };
      Sound.swish();
    });

    // Auto rotate toggle
    btnAutoRotate.addEventListener('click', () => {
      autoRotate = !autoRotate;
      Sound.toggle(autoRotate);
      if (autoRotate) {
        autoRotateIcon.className = 'fa-solid fa-pause text-amber-400';
        autoRotateLabel.textContent = '暫停旋轉';
      } else {
        autoRotateIcon.className = 'fa-solid fa-play text-amber-400';
        autoRotateLabel.textContent = '自動旋轉';
      }
    });

    // Reset to front view
    btnReset.addEventListener('click', () => {
      isFlipping = false;
      isSpinning = false;
      cardGroup.position.z = 0;
      cardGroup.rotation.set(0, 0, 0);
      rotationVelocity = { x: 0, y: 0 };
      Sound.tick();
    });

    // High-speed spin that returns to the current position
    const SPIN_TURNS = 5;
    const SPIN_MS = 1500;          // the fast turns
    const SPIN_SETTLE_MS = 1100;   // overshoot and rock back into place

    // Spin progress 0 → 1 (whole spin) at time T seconds, with overshoot and rock-back
    function spinProgressAt(T) {
      const TS = SPIN_MS / 1000, TW = SPIN_SETTLE_MS / 1000;
      const A = 0.017;
      if (T < TS) {
        const s = T / TS, s2 = s * s, s3 = s2 * s;
        const m1 = A * 3.75 * Math.PI / TW * TS;
        return (-2 * s3 + 3 * s2) + (s3 - s2) * m1;
      }
      const t = Math.min((T - TS) / TW, 1);
      const theta = 3 * Math.PI * (1.25 * t - 0.25 * t * t);
      return 1 + A * Math.exp(-1.6 * t) * (1 - t * t) * Math.sin(theta);
    }
    let isSpinning = false;
    let spinStartTime = 0;
    let spinStartAngle = 0;
    document.getElementById('btn-spin').addEventListener('click', () => {
      if (isSpinning) return;
      isFlipping = false;
      rotationVelocity = { x: 0, y: 0 };
      spinStartAngle = cardGroup.rotation.y;
      spinStartTime = performance.now();
      isSpinning = true;
      Sound.spin(SPIN_TURNS, SPIN_MS, SPIN_SETTLE_MS, spinProgressAt);
    });

    // Reset to back view (card turned 180°, upright)
    document.getElementById('btn-reset-back').addEventListener('click', () => {
      isFlipping = false;
      isSpinning = false;
      cardGroup.position.z = 0;
      cardGroup.rotation.set(0, Math.PI, 0);
      rotationVelocity = { x: 0, y: 0 };
      Sound.tick();
    });

    // Hologram mode selectors — one group for the front, one for the back
    const modeValues = { rainbow: 0, subtle: 1, none: 2 };
    const activeClasses = ['bg-gradient-to-r', 'from-amber-500', 'to-yellow-500', 'text-slate-950', 'shadow-md', 'shadow-amber-500/30'];

    document.querySelectorAll('.holo-group').forEach(group => {
      const target = group.dataset.target === 'back' ? backUniforms : foilCustomShader.uniforms;
      const buttons = group.querySelectorAll('.holo-mode-btn');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove(...activeClasses);
            b.classList.add('glass-btn', 'text-slate-300');
          });
          btn.classList.remove('glass-btn', 'text-slate-300');
          btn.classList.add(...activeClasses);

          target.uMode.value = modeValues[btn.dataset.mode];
          Sound.tick();
        });
      });
    });

    // ---------- Sound toggle ----------
    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    function renderSoundButton() {
      soundIcon.className = Sound.enabled
        ? 'fa-solid fa-volume-high text-emerald-400'
        : 'fa-solid fa-volume-xmark text-slate-400';
    }
    soundBtn.addEventListener('click', () => {
      Sound.setEnabled(!Sound.enabled);
      renderSoundButton();
      if (Sound.enabled) Sound.toggle(true);
      soundBtn.blur();
    });
    renderSoundButton();

    // ---------- Background music ----------
    // Plays bgm.mp3 from the same folder as this page, looped, with soft fades.
    // If bgm.mp3 isn't there, the music button lets you pick an audio file instead.
    const BGM_VOLUME = 0.35;
    const bgm = new Audio('bgm.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0;
    let bgmMissing = false;
    let musicOn = true;
    try { musicOn = localStorage.getItem('cardShowcaseMusic') !== 'off'; } catch (e) {}

    const musicBtn = document.getElementById('btn-music');
    const musicIcon = document.getElementById('music-icon');
    const musicLabel = document.getElementById('music-label');
    const musicInput = document.getElementById('input-music');

    let fadeTimer = null;
    function fadeBgm(target, ms, done) {
      clearInterval(fadeTimer);
      const from = bgm.volume, start = performance.now();
      fadeTimer = setInterval(() => {
        const k = Math.min((performance.now() - start) / ms, 1);
        bgm.volume = Math.max(0, Math.min(1, from + (target - from) * k));
        if (k >= 1) { clearInterval(fadeTimer); if (done) done(); }
      }, 30);
    }

    function renderMusicButton() {
      if (bgmMissing) {
        musicIcon.className = 'fa-solid fa-folder-open text-violet-400';
        musicLabel.textContent = '選擇音樂';
        musicBtn.title = '找不到 bgm.mp3，按此選擇音樂檔';
      } else {
        musicIcon.className = musicOn ? 'fa-solid fa-music text-violet-400' : 'fa-solid fa-music text-slate-500';
        musicLabel.textContent = musicOn ? '音樂' : '音樂 關';
        musicBtn.title = '背景音樂 (B)';
      }
    }

    function startMusic() {
      if (bgmMissing || !musicOn) return;
      const p = bgm.play();
      if (p && p.then) p.then(() => fadeBgm(BGM_VOLUME, 1500)).catch(() => {});
      else fadeBgm(BGM_VOLUME, 1500);
    }
    function stopMusic() {
      fadeBgm(0, 600, () => bgm.pause());
    }
    function setMusic(on) {
      musicOn = on;
      try { localStorage.setItem('cardShowcaseMusic', on ? 'on' : 'off'); } catch (e) {}
      on ? startMusic() : stopMusic();
      renderMusicButton();
    }

    bgm.addEventListener('error', () => { bgmMissing = true; renderMusicButton(); });
    let musicUnlockedAt = 0;
    musicBtn.addEventListener('click', () => {
      if (bgmMissing) musicInput.click();
      // If this very click is what just started the music, don't immediately toggle it off
      else if (performance.now() - musicUnlockedAt > 600) setMusic(!musicOn);
      musicBtn.blur();
    });
    musicInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      bgm.src = URL.createObjectURL(file);
      bgmMissing = false;
      setMusic(true);
      e.target.value = '';
    });

    // Browsers block autoplay with sound: start on the first click or key press
    ['pointerdown', 'keydown'].forEach(ev =>
      window.addEventListener(ev, () => {
        if (musicOn && bgm.paused && !bgmMissing) { musicUnlockedAt = performance.now(); startMusic(); }
      }, { once: true, capture: true }));
    renderMusicButton();

    // ---------- Hide / show UI ----------
    // The button in the bottom-left slides every other control out to its edge, and back.
    const btnToggleUi = document.getElementById('btn-toggle-ui');
    const toggleUiIcon = document.getElementById('toggle-ui-icon');
    const toggleUiLabel = document.getElementById('toggle-ui-label');
    let uiHidden = false;

    function setUiHidden(hidden) {
      uiHidden = hidden;
      document.body.classList.toggle('ui-hidden', hidden);
      toggleUiIcon.className = (hidden ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash') + ' text-amber-400 w-4';
      toggleUiLabel.textContent = hidden ? '顯示介面' : '隱藏介面';
      if (hidden) bgPopover.classList.add('hidden');
    }

    btnToggleUi.addEventListener('click', () => {
      setUiHidden(!uiHidden);
      Sound.toggle(!uiHidden);
      btnToggleUi.blur();
    });
    // Keyboard shortcuts: Q flip · W auto-rotate · E high-speed spin · R front reset · T back reset · H hide UI
    const SHORTCUTS = { q: 'btn-flip', w: 'btn-autorotate', e: 'btn-spin', r: 'btn-reset', t: 'btn-reset-back' };
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
      const key = e.key.toLowerCase();
      if (key === 'h') { setUiHidden(!uiHidden); Sound.toggle(!uiHidden); return; }
      if (key === 'm') { soundBtn.click(); return; }
      if (key === 'b') { musicBtn.click(); return; }
      const id = SHORTCUTS[key];
      if (id) {
        e.preventDefault();
        document.getElementById(id).click();
      }
    });

    // Background colour: the chosen colour lights the centre and fades to near-black
    const bgPresets = ['#181528', '#0f172a', '#1e3a5f', '#14532d', '#4c0519', '#3b2a0a',
                       '#312e81', '#164e63', '#581c87', '#000000', '#374151', '#f1f5f9'];
    const bgButton = document.getElementById('btn-bg');
    const bgPopover = document.getElementById('bg-popover');
    const bgSwatch = document.getElementById('bg-swatch');
    const bgInput = document.getElementById('input-bg');
    const bgPresetGrid = document.getElementById('bg-presets');

    function mixWithBlack(hex, amount) {
      const n = parseInt(hex.slice(1), 16);
      const f = 1 - amount;
      const r = Math.round(((n >> 16) & 255) * f);
      const g = Math.round(((n >> 8) & 255) * f);
      const b = Math.round((n & 255) * f);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function applyBackground(hex) {
      document.body.style.background =
        `radial-gradient(circle at 50% 45%, ${hex} 0%, ${mixWithBlack(hex, 0.45)} 60%, ${mixWithBlack(hex, 0.8)} 100%)`;
      bgSwatch.style.background = hex;
      bgInput.value = hex;
      try { localStorage.setItem('cardShowcaseBg', hex); } catch (e) {}
    }

    bgPresets.forEach(hex => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.title = hex;
      dot.className = 'w-6 h-6 rounded-full border border-white/30 hover:scale-110 transition-transform';
      dot.style.background = hex;
      dot.addEventListener('click', () => applyBackground(hex));
      bgPresetGrid.appendChild(dot);
    });

    bgInput.addEventListener('input', (e) => applyBackground(e.target.value));

    bgButton.addEventListener('click', (e) => {
      e.stopPropagation();
      bgPopover.classList.toggle('hidden');
    });
    bgPopover.addEventListener('mousedown', (e) => e.stopPropagation());
    document.addEventListener('click', (e) => {
      if (!bgPopover.contains(e.target) && e.target !== bgButton) bgPopover.classList.add('hidden');
    });

    try {
      const savedBg = localStorage.getItem('cardShowcaseBg');
      if (savedBg) applyBackground(savedBg);
    } catch (e) {}

    // Custom image uploading for front and back
    // "更換正面" now adds to the front gallery too (multiple files allowed)
    document.getElementById('input-front').addEventListener('change', (e) => {
      addFrontFiles(e.target.files);
      e.target.value = '';
    });

    document.getElementById('input-back').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.src = ev.target.result;
          img.onload = () => {
            const newTex = new THREE.Texture(img);
            newTex.needsUpdate = true;
            backUniforms.tDiffuse.value = newTex;
            currentBackIndex = -1;
            renderBackGallery();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- Snowfall over the whole scene ----------
    // Flakes fall and sway on the GPU; some drift in front of the card, some behind it.
    const SNOW_COUNT = 900;
    const SNOW_TOP = 7, SNOW_SPAN = 14;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(SNOW_COUNT * 3);
    const snowSpeed = new Float32Array(SNOW_COUNT);
    const snowPhase = new Float32Array(SNOW_COUNT);
    const snowSize = new Float32Array(SNOW_COUNT);
    const snowAlpha = new Float32Array(SNOW_COUNT);
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowPos[i * 3] = (Math.random() - 0.5) * 26;
      snowPos[i * 3 + 1] = Math.random() * SNOW_SPAN - SNOW_SPAN / 2;
      snowPos[i * 3 + 2] = -7 + Math.random() * 11;          // z from -7 (far) to 4 (near)
      const near = (snowPos[i * 3 + 2] + 7) / 11;            // 0 far … 1 near
      snowSpeed[i] = 0.35 + Math.random() * 0.45 + near * 0.3;
      snowPhase[i] = Math.random() * Math.PI * 2;
      snowSize[i] = 0.04 + Math.pow(Math.random(), 2.5) * 0.12;
      snowAlpha[i] = 0.45 + Math.random() * 0.5;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    snowGeo.setAttribute('aSpeed', new THREE.BufferAttribute(snowSpeed, 1));
    snowGeo.setAttribute('aPhase', new THREE.BufferAttribute(snowPhase, 1));
    snowGeo.setAttribute('aSize', new THREE.BufferAttribute(snowSize, 1));
    snowGeo.setAttribute('aAlpha', new THREE.BufferAttribute(snowAlpha, 1));

    const snowMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uScale: { value: 400 },
        uTop: { value: SNOW_TOP },
        uSpan: { value: SNOW_SPAN }
      },
      vertexShader: `
        attribute float aSpeed;
        attribute float aPhase;
        attribute float aSize;
        attribute float aAlpha;
        uniform float uTime;
        uniform float uScale;
        uniform float uTop;
        uniform float uSpan;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          // Fall and wrap around top-to-bottom
          p.y = uTop - mod(uTop - p.y + uTime * aSpeed, uSpan);
          // Gentle side-to-side drift, plus a slow breeze
          p.x += sin(uTime * (0.6 + aSpeed * 0.5) + aPhase) * 0.35 + sin(uTime * 0.15 + aPhase * 0.3) * 0.6;
          p.z += cos(uTime * 0.5 + aPhase) * 0.15;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          // Skip flakes behind the camera (when zoomed in) and cap very close ones
          gl_PointSize = -mv.z > 0.3 ? min(aSize * uScale / -mv.z, 48.0) : 0.0;
          gl_Position = projectionMatrix * mv;
          // Fade near the top and bottom of the wrap so flakes never pop in or out
          float edge = smoothstep(uTop, uTop - 1.0, p.y) * smoothstep(uTop - uSpan, uTop - uSpan + 1.0, p.y);
          vAlpha = aAlpha * edge;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.1, d) * vAlpha;   // soft round flake
          if (a < 0.01) discard;
          gl_FragColor = vec4(1.0, 1.0, 1.0, a);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending
    });
    const snow = new THREE.Points(snowGeo, snowMaterial);
    snow.frustumCulled = false;
    scene.add(snow);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      foilCustomShader.uniforms.uTime.value = elapsedTime;

      // High-speed spin: several full turns, overshoots its landing, rocks back and settles
      // exactly where it started
      if (isSpinning) {
        const T = (performance.now() - spinStartTime) / 1000;
        const TS = SPIN_MS / 1000, TW = SPIN_SETTLE_MS / 1000;
        const k = spinProgressAt(T);
        cardGroup.rotation.y = spinStartAngle + k * SPIN_TURNS * Math.PI * 2;
        cardGroup.position.z = Math.sin(Math.min(T / TS, 1) * Math.PI) * 0.6;   // lifts mid-spin
        if (T >= TS + TW) {
          cardGroup.rotation.y = spinStartAngle;                      // exact original orientation
          cardGroup.position.z = 0;
          isSpinning = false;
        }
      }

      // Handle Flip Animation
      if (isFlipping) {
        const progress = Math.min((performance.now() - flipStartTime) / 600, 1.0);
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        cardGroup.rotation.y = flipStartAngle + (flipTargetAngle - flipStartAngle) * ease;
        if (progress >= 1.0) isFlipping = false;
      }

      // Handle Drag Inertia, Auto-Rotation, or Hover Tilt
      if (!isDragging && !isFlipping && !isSpinning) {
        if (autoRotate) {
          cardGroup.rotation.y += 0.016;
          cardGroup.rotation.x = Math.sin(elapsedTime * 1.5) * 0.12;
        } else {
          // Apply angular momentum
          cardGroup.rotation.y += rotationVelocity.y;
          cardGroup.rotation.x += rotationVelocity.x;
          rotationVelocity.x *= friction;
          rotationVelocity.y *= friction;

          // Gentle breathing float
          cardGroup.position.y = Math.sin(elapsedTime * 2.0) * 0.04;
        }
      }

      // Hover tilt lives on the inner mesh so it layers on top of drag/flip rotation.
      // Eases back to flat while dragging, flipping or auto-rotating.
      const tiltActive = !isDragging && !isFlipping && !autoRotate && !isSpinning;
      const targetTiltX = tiltActive ? hoverTiltX : 0;
      const targetTiltY = tiltActive ? hoverTiltY : 0;
      cardMesh.rotation.x += (targetTiltX - cardMesh.rotation.x) * 0.08;
      cardMesh.rotation.y += (targetTiltY - cardMesh.rotation.y) * 0.08;

      updateFrontTransition();
      updateBurst();
      updateLaser();

      // Snow
      snowMaterial.uniforms.uTime.value = elapsedTime;
      snowMaterial.uniforms.uScale.value = renderer.getPixelRatio() * window.innerHeight * 0.5;


      // Degree readout
      let degrees = Math.round(((cardGroup.rotation.y % (Math.PI * 2)) / (Math.PI * 2)) * 360);
      if (degrees < 0) degrees += 360;
      if (rotationIndicator) {
        rotationIndicator.textContent = `旋轉: ${degrees}°`;
      }

      renderer.render(scene, camera);
    }

    window.onload = function () {
      animate();
    };
  </script>
</body>
</html>
